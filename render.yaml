services:
  - type: worker          # ← worker, NOT web — bots don't need an HTTP port
    name: saini-txt-bot
    env: python
    plan: free
    branch: main
    buildCommand: pip install -r sainibots.txt
    startCommand: python3 main.py
    autoDeploy: false
    envVars:
      - key: BOT_TOKEN
        sync: false       # you fill this in Render dashboard
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: API_TOKEN
        sync: false
      - key: TOKEN_CP
        sync: false
      - key: ADDA_TOKEN
        sync: false
